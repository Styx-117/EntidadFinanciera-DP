<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Solicitudes pendientes')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: lateral('pendientes')}"></aside>
    <main class="contenido">
        <header class="encabezado">
            <div>
                <h1>Solicitudes pendientes</h1>
                <p class="subtitulo">Créditos que esperan tu revisión, de la más antigua a la más reciente.</p>
            </div>
        </header>
        <div th:replace="~{fragments :: mensajes}"></div>

        <section class="tiles">
            <div class="tile">
                <span class="tile-ico"><svg class="ico"><use href="#i-pendientes"/></svg></span>
                <div><span class="tile-etiqueta">Pendientes</span><span class="tile-valor" th:attr="data-contar=${#lists.size(solicitudes)},data-entero=''" th:text="${#lists.size(solicitudes)}">0</span></div>
            </div>
            <div class="tile">
                <span class="tile-ico oro"><svg class="ico"><use href="#i-campana"/></svg></span>
                <div><span class="tile-etiqueta">Sin iniciar</span><span class="tile-valor" th:text="${#lists.size(solicitudes.?[estado == 'SOLICITADO'])}">0</span></div>
            </div>
            <div class="tile">
                <span class="tile-ico azul"><svg class="ico"><use href="#i-billetes"/></svg></span>
                <div><span class="tile-etiqueta">Monto en revisión</span><span class="tile-valor" th:text="${#lists.isEmpty(solicitudes)} ? 'S/ 0.00' : ('S/ ' + ${#numbers.formatDecimal(#aggregates.sum(solicitudes.![monto]), 1, 'COMMA', 2, 'POINT')})">S/ 0.00</span></div>
            </div>
        </section>

        <div class="tabla-caja">
            <table class="tabla">
                <thead>
                <tr><th>Fecha</th><th>Cliente</th><th class="num">Monto (S/)</th><th>Plazo</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${solicitudes}">
                    <td th:text="${#temporals.format(c.fechaSolicitud, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <strong th:text="${c.clienteNombre}">Cliente</strong>
                        <span class="secundario-texto" th:text="'DNI ' + ${c.clienteDni}">DNI</span>
                    </td>
                    <td class="num" th:text="${#numbers.formatDecimal(c.monto, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    <td th:text="${c.plazoMeses + ' meses'}">12 meses</td>
                    <td><span th:replace="~{fragments :: estado(${c.estado})}"></span></td>
                    <td>
                        <div class="acciones">
                            <a class="boton secundario chico" th:href="@{/asesor/cliente/{id}(id=${c.idCliente})}"><svg class="ico"><use href="#i-usuario"/></svg>Historial</a>
                            <a class="boton chico" th:href="@{/asesor/solicitud/{id}(id=${c.idCredito})}"
                               th:text="${c.estado == 'SOLICITADO'} ? 'Evaluar' : 'Continuar'">Evaluar</a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(solicitudes)}">
                    <td colspan="6" class="vacio">No hay solicitudes pendientes por ahora.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
