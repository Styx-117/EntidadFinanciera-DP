<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pedir un crédito')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: lateral('credito')}"></aside>
    <main class="contenido">
        <h1>Pedir un crédito</h1>
        <p class="subtitulo">Envía tu solicitud y sigue su estado aquí mismo.</p>
        <div th:replace="~{fragments :: mensajes}"></div>

        <div class="dos-columnas">
            <form class="panel" th:action="@{/cliente/credito}" method="post">
                <h2>Nueva solicitud</h2>
                <div class="campo">
                    <label for="monto">Monto (S/)</label>
                    <input id="monto" name="monto" type="number" min="500" max="100000" step="0.01" required>
                    <div class="ayuda">Entre S/ 500 y S/ 100,000.</div>
                </div>
                <div class="campo">
                    <label for="plazo">Plazo</label>
                    <select id="plazo" name="plazo" required>
                        <option th:each="p : ${plazos}" th:value="${p}" th:text="${p + ' meses'}">12 meses</option>
                    </select>
                    <div class="ayuda">Tasa referencial: <span th:text="${tasa}">18.00</span>% anual.</div>
                </div>
                <button class="boton" type="submit">Enviar solicitud</button>
            </form>

            <div>
                <h2 style="font-size:1.15rem;margin-bottom:12px">Mis solicitudes</h2>
                <div class="tabla-caja">
                    <table class="tabla">
                        <thead>
                        <tr><th>Fecha</th><th class="num">Monto</th><th>Plazo</th><th class="num">Cuota aprox.</th><th>Estado</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${creditos}">
                            <td th:text="${#temporals.format(c.fechaSolicitud, 'dd/MM/yyyy')}">01/01/2026</td>
                            <td class="num" th:text="${#numbers.formatDecimal(c.monto, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                            <td th:text="${c.plazoMeses + ' meses'}">12 meses</td>
                            <td class="num" th:text="${#numbers.formatDecimal(c.cuotaMensual(), 1, 'COMMA', 2, 'POINT')}">0.00</td>
                            <td><span class="estado" th:classappend="'estado-' + ${c.estado}"
                                      th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(c.estado, '_', ' ')))}">Solicitado</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(creditos)}">
                            <td colspan="5" class="vacio">Aún no has enviado ninguna solicitud.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
