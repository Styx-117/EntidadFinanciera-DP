<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Movimientos')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: lateral('movimientos')}"></aside>
    <main class="contenido">
        <header class="encabezado">
            <div>
                <h1>Movimientos</h1>
                <p class="subtitulo">Tus últimas 50 operaciones, de la más reciente a la más antigua.</p>
            </div>
        </header>
        <div th:replace="~{fragments :: mensajes}"></div>

        <form class="campo" style="max-width:520px" th:action="@{/cliente/movimientos}" method="get">
            <label for="cuenta">Cuenta</label>
            <select id="cuenta" name="cuenta" onchange="this.form.submit()">
                <option th:each="c : ${cuentas}" th:value="${c.numeroCuenta}"
                        th:selected="${c.numeroCuenta == seleccionada}"
                        th:text="${c.numeroCuenta + ' · ' + #strings.capitalize(#strings.toLowerCase(c.tipo))}">001-0000001</option>
            </select>
        </form>

        <div class="tabla-caja">
            <table class="tabla">
                <thead>
                <tr><th>Fecha</th><th>Operación</th><th class="num">Monto (S/)</th></tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movimientos}">
                    <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td>
                        <div class="mov">
                            <span class="mov-ico" th:classappend="${m.ingreso} ? 'ingreso' : 'egreso'"><svg class="ico"><use th:href="${m.ingreso} ? '#i-ingreso' : '#i-egreso'"/></svg></span>
                            <div>
                                <strong><span th:replace="~{fragments :: operacion(${m.tipo})}"></span></strong>
                                <span class="secundario-texto" th:text="${m.descripcion}">Detalle</span>
                            </div>
                        </div>
                    </td>
                    <td class="num">
                        <span th:if="${m.ingreso}" class="monto-ingreso"
                              th:text="'+ ' + ${#numbers.formatDecimal(m.monto, 1, 'COMMA', 2, 'POINT')}">+ 0.00</span>
                        <span th:unless="${m.ingreso}" class="monto-egreso"
                              th:text="'− ' + ${#numbers.formatDecimal(m.monto, 1, 'COMMA', 2, 'POINT')}">− 0.00</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="3" class="vacio">Esta cuenta aún no tiene movimientos.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
