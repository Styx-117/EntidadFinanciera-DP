<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body>
<div class="login">
    <section class="login-lado">
        <span class="marca"><span class="logo">F</span><span>Facil<b>Bank</b></span></span>
        <svg class="ilustracion" viewBox="0 0 520 520" role="img" aria-label="Ilustración de la aplicación de FacilBank">
            <defs>
                <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f6d77e"/>
                    <stop offset="1" stop-color="#d9a020"/>
                </linearGradient>
                <linearGradient id="pantalla" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset="1" stop-color="#eef2ef"/>
                </linearGradient>
            </defs>
            <circle cx="260" cy="270" r="215" fill="#17504e" fill-opacity=".55"/>
            <circle cx="260" cy="270" r="160" fill="#1f6360" fill-opacity=".7"/>
            <g class="flota-2">
                <g transform="rotate(-14 180 190)">
                    <rect x="50" y="110" width="250" height="150" rx="18" fill="url(#oro)"/>
                    <rect x="72" y="140" width="40" height="30" rx="6" fill="#0e3b3a" fill-opacity=".25"/>
                    <rect x="72" y="200" width="130" height="10" rx="5" fill="#0e3b3a" fill-opacity=".35"/>
                    <rect x="72" y="224" width="80" height="8" rx="4" fill="#0e3b3a" fill-opacity=".25"/>
                    <circle cx="262" cy="150" r="14" fill="#0e3b3a" fill-opacity=".25"/>
                    <circle cx="246" cy="150" r="14" fill="#0e3b3a" fill-opacity=".18"/>
                </g>
            </g>
            <rect x="180" y="50" width="210" height="420" rx="36" fill="#0a2c2b" stroke="#2a6d6a" stroke-width="3"/>
            <rect x="192" y="66" width="186" height="388" rx="26" fill="url(#pantalla)"/>
            <rect x="253" y="74" width="64" height="10" rx="5" fill="#0a2c2b"/>
            <text x="208" y="118" font-family="Figtree, Segoe UI, sans-serif" font-size="13" fill="#5b6b66">Hola, Ana</text>
            <rect x="206" y="130" width="158" height="86" rx="14" fill="#0e3b3a"/>
            <text x="222" y="156" font-family="Figtree, Segoe UI, sans-serif" font-size="11" fill="#a9c4c0">Saldo total</text>
            <text x="222" y="190" font-family="Bricolage Grotesque, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#ffffff">S/ 4,700.00</text>
            <path d="M222 205c14-8 22 4 36-2s24-10 40-4 24-6 48-10" fill="none" stroke="#e9b02e" stroke-width="2.5" stroke-linecap="round"/>
            <g>
                <circle cx="222" cy="252" r="13" fill="#d6efe0"/>
                <path d="M217 256l10-8m-7 0h7v7" fill="none" stroke="#1b7f4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="244" y="244" width="70" height="8" rx="4" fill="#16231f" fill-opacity=".8"/>
                <rect x="244" y="258" width="46" height="6" rx="3" fill="#5b6b66" fill-opacity=".5"/>
                <rect x="322" y="248" width="42" height="9" rx="4" fill="#1b7f4b"/>
            </g>
            <g>
                <circle cx="222" cy="298" r="13" fill="#f6d9d5"/>
                <path d="M227 292l-10 8m7 0h-7v-7" fill="none" stroke="#b3382c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="244" y="290" width="62" height="8" rx="4" fill="#16231f" fill-opacity=".8"/>
                <rect x="244" y="304" width="52" height="6" rx="3" fill="#5b6b66" fill-opacity=".5"/>
                <rect x="322" y="294" width="42" height="9" rx="4" fill="#b3382c"/>
            </g>
            <g>
                <circle cx="222" cy="344" r="13" fill="#fbefc9"/>
                <path d="M222 337l-5 8h5l-1 6 6-9h-5z" fill="#8a6200"/>
                <rect x="244" y="336" width="74" height="8" rx="4" fill="#16231f" fill-opacity=".8"/>
                <rect x="244" y="350" width="40" height="6" rx="3" fill="#5b6b66" fill-opacity=".5"/>
                <rect x="326" y="340" width="38" height="9" rx="4" fill="#b3382c"/>
            </g>
            <rect x="206" y="396" width="158" height="38" rx="19" fill="#0e3b3a"/>
            <text x="285" y="420" text-anchor="middle" font-family="Figtree, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Transferir</text>
            <g class="flota">
                <rect x="318" y="150" width="190" height="52" rx="26" fill="#ffffff"/>
                <circle cx="346" cy="176" r="15" fill="#1b7f4b"/>
                <path d="M339 176l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="370" y="172" font-family="Figtree, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#16231f">Transferencia</text>
                <text x="370" y="188" font-family="Figtree, Segoe UI, sans-serif" font-size="11" fill="#5b6b66">enviada con éxito</text>
            </g>
            <g class="flota-3">
                <rect x="30" y="330" width="150" height="84" rx="16" fill="#ffffff"/>
                <text x="46" y="356" font-family="Figtree, Segoe UI, sans-serif" font-size="11" fill="#5b6b66">Crédito aprobado</text>
                <path d="M46 396l22-14 20 8 24-24 22-8" fill="none" stroke="#17504e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="136" cy="360" r="5" fill="#e9b02e"/>
            </g>
            <circle cx="470" cy="330" r="24" fill="url(#oro)"/>
            <circle cx="470" cy="330" r="15" fill="none" stroke="#0e3b3a" stroke-opacity=".3" stroke-width="3"/>
            <circle cx="90" cy="130" r="10" fill="url(#oro)"/>
            <circle cx="440" cy="440" r="8" fill="#e9b02e" fill-opacity=".6"/>
        </svg>
        <div class="login-texto">
            <h1>Sin colas ni ventanilla.</h1>
            <p>Consulta tus saldos, transfiere dinero y paga tus servicios desde donde estés.</p>
        </div>
    </section>
    <section class="login-form-lado">
        <form class="login-form" th:action="@{/login}" method="post">
            <h2>Ingresa a tu cuenta</h2>
            <p class="subtitulo">Usa el usuario que te dio el banco.</p>
            <div class="aviso error" th:if="${error}" th:text="${error}"></div>
            <div class="campo">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <div class="con-boton">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" id="ver-clave">Mostrar</button>
                </div>
            </div>
            <button class="boton ancho" type="submit">Ingresar</button>
        </form>
    </section>
</div>
</body>
</html>
